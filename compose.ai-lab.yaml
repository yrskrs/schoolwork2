name: schoolwork2-ai-lab

x-app: &app
  image: schoolwork2-ai-lab-app:local
  restart: "no"
  env_file: .env.ai-lab.local
  environment:
    SCHOOLNET_LOCAL_LAB: "1"
    DEBUG: "True"
    DATABASE_URL: postgres://ai_lab:${LAB_DB_PASSWORD:?Run scripts/ai-lab.sh first}@postgres:5432/ai_lab
    AI_JOBS_EAGER: "False"
    AI_CACHE_DIR: /var/cache/schoolnet/ai
    CLOUD_IMPORT_ROOT: /var/cache/schoolnet/cloud-imports
    CODE_RUNNER_URL: http://code_runner:8002
    CODE_RUNNER_TOKEN: ${LAB_RUNNER_TOKEN:?Run scripts/ai-lab.sh first}
  volumes:
    - .:/app:ro
    - lab_media:/app/media
    - lab_logs:/app/logs
    - lab_static:/app/staticfiles
    - lab_cache:/var/cache/schoolnet

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${LAB_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, runner_control]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s

  ai_worker:
    <<: *app
    command: [python, manage.py, process_ai_jobs]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert all(time.time()-os.path.getmtime(p)<60 for p in ['/tmp/schoolnet-ai-worker-heartbeat','/tmp/schoolnet-cloud-worker-heartbeat'])"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_DB: ai_lab
      POSTGRES_USER: ai_lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?Run scripts/ai-lab.sh first}
    volumes:
      - lab_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ai_lab -d ai_lab"]
      interval: 5s
      timeout: 5s
      retries: 12

  code_runner:
    image: schoolwork2-ai-lab-runner:local
    build:
      context: .
      dockerfile: runner/Dockerfile
    restart: "no"
    environment:
      CODE_RUNNER_TOKEN: ${LAB_RUNNER_TOKEN:?Run scripts/ai-lab.sh first}
      CODE_RUNNER_IMAGE: schoolwork2-ai-lab-runner:local
      CODE_RUNNER_NAMESPACE: schoolwork2-ai-lab
      CODE_RUNNER_MAX_SESSIONS: "2"
      CODE_RUNNER_RUN_SECONDS: "180"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [runner_control]
    healthcheck:
      test: [CMD, /usr/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6

volumes:
  lab_db:
  lab_media:
  lab_logs:
  lab_static:
  lab_cache:

networks:
  default: {}
  runner_control:
    internal: true
