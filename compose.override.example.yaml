# Приклад локального перевизначення для розробника (Workstation Override)
# Скопіюйте цей файл у compose.override.yaml (ігнорується git):
#   cp compose.override.example.yaml compose.override.yaml
#
# Це гарантує, що базові контейнери на локальній машині НЕ запускатимуться автоматично
# після перезавантаження системи (restart: "no"), не зачіпаючи бойовий сервер.

services:
  app:
    restart: "no"
  ai_worker:
    restart: "no"
  code_runner:
    restart: "no"
  postgres:
    restart: "no"
  updater:
    restart: "no"

  # network_info визначений у compose.lan.yaml.
  # Якщо ви розкоментовуєте його для локальних LAN-тестів, обов'язково залишайте рядок image,
  # щоб docker compose не видавав помилку при запуску без compose.lan.yaml:
  # network_info:
  #   image: ${SCHOOLWORK_IMAGE:-schoolwork2-app:4.13.3}
  #   restart: "no"
