name: ${COMPOSE_PROJECT_NAME:-schoolwork2}
services:
  app:
    image: ${SCHOOLWORK_IMAGE:-schoolwork2-app:4.2.1}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local}
    container_name: schoolnet_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AI_JOBS_EAGER: 'False'
      AI_CACHE_DIR: '/var/cache/schoolnet/ai'
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_media:/app/media
      - app_logs:/app/logs
      - app_cache:/var/cache/schoolnet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/teacher/login/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 45s

  ai_worker:
    image: ${SCHOOLWORK_IMAGE:-schoolwork2-app:4.2.1}
    container_name: schoolnet_ai_worker
    restart: unless-stopped
    command: ["python", "manage.py", "process_ai_jobs"]
    env_file:
      - .env
    environment:
      AI_JOBS_EAGER: 'False'
      AI_CACHE_DIR: '/var/cache/schoolnet/ai'
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - app_media:/app/media
      - app_logs:/app/logs
      - app_cache:/var/cache/schoolnet
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/schoolnet-ai-worker-heartbeat') < 60"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: schoolnet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolnet_db}
      POSTGRES_USER: ${POSTGRES_USER:-schoolnet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolnet_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolnet_user} -d ${POSTGRES_DB:-schoolnet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_media:
  app_logs:
  app_cache:
