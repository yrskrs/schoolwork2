name: ${COMPOSE_PROJECT_NAME:-schoolwork2}
services:
  app:
    image: ${SCHOOLWORK_IMAGE:-schoolwork2-app:4.5.13}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local}
        SOURCE_DIGEST: ${SOURCE_DIGEST:-unknown}
        APP_VERSION: '4.5.13'
    container_name: schoolnet_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AI_JOBS_EAGER: 'False'
      AI_CACHE_DIR: '/var/cache/schoolnet/ai'
      CLOUD_IMPORT_ROOT: '/var/cache/schoolnet/cloud-imports'
      CODE_RUNNER_URL: 'http://code_runner:8002'
      CODE_RUNNER_TOKEN: '${CODE_RUNNER_TOKEN:-${SECRET_KEY}}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default: {}
      runner_control: {}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_media:/app/media
      - app_logs:/app/logs
      - app_cache:/var/cache/schoolnet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 45s

  ai_worker:
    image: ${SCHOOLWORK_IMAGE:-schoolwork2-app:4.5.13}
    container_name: schoolnet_ai_worker
    restart: unless-stopped
    command: ["python", "manage.py", "process_ai_jobs"]
    env_file:
      - .env
    environment:
      AI_JOBS_EAGER: 'False'
      AI_CACHE_DIR: '/var/cache/schoolnet/ai'
      CLOUD_IMPORT_ROOT: '/var/cache/schoolnet/cloud-imports'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - app_media:/app/media
      - app_logs:/app/logs
      - app_cache:/var/cache/schoolnet
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert all(time.time()-os.path.getmtime(p)<60 for p in ['/tmp/schoolnet-ai-worker-heartbeat','/tmp/schoolnet-cloud-worker-heartbeat'])"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  code_runner:
    image: ${CODE_RUNNER_IMAGE:-schoolwork2-python-runner:4.5.7}
    build:
      context: .
      dockerfile: runner/Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local}
        APP_VERSION: '4.5.7'
    restart: unless-stopped
    environment:
      CODE_RUNNER_TOKEN: '${CODE_RUNNER_TOKEN:-${SECRET_KEY}}'
      CODE_RUNNER_IMAGE: '${CODE_RUNNER_IMAGE:-schoolwork2-python-runner:4.5.7}'
      CODE_RUNNER_NAMESPACE: '${COMPOSE_PROJECT_NAME:-schoolwork2}'
      CODE_RUNNER_MAX_SESSIONS: '${CODE_RUNNER_MAX_SESSIONS:-4}'
      CODE_RUNNER_RUN_SECONDS: '${CODE_RUNNER_RUN_SECONDS:-180}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      runner_control: {}
    expose:
      - '8002'
    healthcheck:
      test: ['CMD', '/usr/bin/python3', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    container_name: schoolnet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolnet_db}
      POSTGRES_USER: ${POSTGRES_USER:-schoolnet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolnet_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolnet_user} -d ${POSTGRES_DB:-schoolnet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  updater:
    image: ${UPDATER_IMAGE:-schoolwork2-updater:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.updater
    container_name: schoolnet_updater
    restart: unless-stopped
    environment:
      SCHOOLWORK_ROOT: /workspace
      ENV_FILE: /workspace/.env
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-schoolwork2}
      UPDATER_PORT: 8001
      GITHUB_REPO: yrskrs/schoolwork2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  app_media:
  app_logs:
  app_cache:

networks:
  default: {}
  runner_control:
    internal: true
