{% load static %}
<!-- ── Модальне вікно «Розклад на сьогодні» з живим статус-баром та анімацією в реальному часі ── -->
<div id="today-schedule-modal" style="display:none;position:fixed;inset:0;width:100%;height:100%;background:rgba(15,23,42,0.65);z-index:99999;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(4px);box-sizing:border-box;">
    <div class="custom-modal-content" style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);width:100%;max-width:500px;box-shadow:0 16px 36px rgba(0,0,0,0.22);overflow:hidden;animation:rescheduleModalIn 0.2s ease-out;max-height:86vh;display:flex;flex-direction:column;">
        
        <!-- Заголовок (компактний) -->
        <div style="padding:10px 16px;background:var(--color-bg-secondary);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
            <div>
                <div style="display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--color-text-primary);">
                    <span style="font-size:16px;">📅</span>
                    <span>Розклад на сьогодні</span>
                </div>
                <div id="today-schedule-date-subtitle" style="font-size:11.5px;color:var(--color-text-muted);margin-top:1px;">
                    Завантаження розкладу...
                </div>
            </div>
            <button type="button" onclick="closeTodayScheduleModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--color-text-muted);line-height:1;padding:4px;" aria-label="Закрити">✕</button>
        </div>

        <!-- 🌟 ЖИВИЙ СТАТУС-БАР ПОТОЧНОГО УРОКУ / ПЕРЕРВИ З АНІМАЦІЄЮ В РЕАЛЬНОМУ ЧАСІ 🌟 -->
        <div id="modal-live-status-container" style="display:none;padding:10px 14px;background:var(--color-surface);border-bottom:1px solid var(--color-border);flex-shrink:0;">
            <div id="modal-live-status-card" style="border-radius:var(--radius-md);padding:10px 12px;border:1px solid var(--color-border);position:relative;overflow:hidden;background:var(--color-bg-secondary);">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span id="modal-live-badge" class="badge" style="font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:12px;">
                            —
                        </span>
                        <strong id="modal-live-title" style="font-size:13px;color:var(--color-text-primary);">
                            —
                        </strong>
                    </div>
                    <div style="font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;" id="modal-live-timer-text">
                        <span>⏱️</span>
                        <span id="modal-live-time-val">—</span>
                    </div>
                </div>

                <!-- Анімований статус-бар прогресу -->
                <div style="margin-top:7px;height:6px;width:100%;background:rgba(0,0,0,0.08);border-radius:3px;overflow:hidden;position:relative;">
                    <div id="modal-live-progress-fill" style="height:100%;width:0%;border-radius:3px;transition:width 0.4s ease;animation:liveBarShimmer 2.5s ease-in-out infinite;"></div>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--color-text-muted);margin-top:3px;">
                    <span id="modal-live-elapsed-info">Минуло: 0 хв</span>
                    <span id="modal-live-pct-info">0%</span>
                </div>
            </div>
        </div>

        <!-- Контент списку уроків (компактний) -->
        <div style="padding:10px 14px;overflow-y:auto;flex:1;" id="today-schedule-modal-body">
            <div style="text-align:center;padding:24px;color:var(--color-text-muted);">
                <div style="font-size:24px;margin-bottom:6px;">⏳</div>
                <div style="font-size:12.5px;">Оновлення даних розкладу...</div>
            </div>
        </div>

        <!-- Футер з лічильником та швидкими переходами (компактний) -->
        <div style="padding:8px 14px;background:var(--color-bg-secondary);border-top:1px solid var(--color-border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;flex-shrink:0;">
            <div style="font-size:11.5px;color:var(--color-text-secondary);display:flex;align-items:center;gap:5px;">
                <span>🎓 Проведено:</span>
                <strong id="modal-conducted-count" style="color:var(--color-primary);font-size:12px;">—</strong>
                <button type="button" onclick="openConductedLessonsModal()" class="btn btn-secondary btn-sm" style="font-size:10px;padding:1px 5px;" title="Змінити вручну">✏️</button>
            </div>

            <div style="display:flex;gap:6px;">
                <a href="{% url 'teacher_students' %}?tab=schedule" class="btn btn-secondary btn-sm" style="font-weight:700;font-size:11.5px;padding:4px 8px;">
                    🗓️ Повний
                </a>
                <button type="button" class="btn btn-primary btn-sm" onclick="closeTodayScheduleModal()" style="font-weight:700;font-size:11.5px;padding:4px 10px;">
                    Зрозуміло
                </button>
            </div>
        </div>

    </div>
</div>

<style>
@keyframes liveBarShimmer {
    0% { filter: brightness(0.96); }
    50% { filter: brightness(1.24); }
    100% { filter: brightness(0.96); }
}
@keyframes liveDotGlow {
    0% { transform: scale(0.92); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.92); opacity: 0.8; }
}
</style>

<script data-dialog-script="{% static 'js/today_schedule_dialog.js' %}?ui=20261106">(window.schoolDialogQueue = window.schoolDialogQueue || []).push({url: document.currentScript.dataset.dialogScript, names: ["openTodayScheduleModal"]});</script>
