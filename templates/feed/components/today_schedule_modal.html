<!-- ── Модальне вікно «Розклад на сьогодні» з компактним дизайном та візуальним прогрес-баром ── -->
<div id="today-schedule-modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.65);z-index:99999;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(4px);">
    <div class="custom-modal-content" style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);width:100%;max-width:480px;box-shadow:0 16px 36px rgba(0,0,0,0.22);overflow:hidden;animation:rescheduleModalIn 0.2s ease-out;max-height:82vh;display:flex;flex-direction:column;">
        
        <!-- Заголовок (компактний) -->
        <div style="padding:10px 16px;background:var(--color-bg-secondary);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
            <div>
                <div style="display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--color-text-primary);">
                    <span style="font-size:16px;">📅</span>
                    <span>Розклад на сьогодні</span>
                </div>
                <div id="today-schedule-date-subtitle" style="font-size:11.5px;color:var(--color-text-muted);margin-top:1px;">
                    Завантаження розкладу...
                </div>
            </div>
            <button type="button" onclick="closeTodayScheduleModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--color-text-muted);line-height:1;padding:4px;" aria-label="Закрити">✕</button>
        </div>

        <!-- Контент списку уроків (компактний) -->
        <div style="padding:10px 14px;overflow-y:auto;flex:1;" id="today-schedule-modal-body">
            <div style="text-align:center;padding:24px;color:var(--color-text-muted);">
                <div style="font-size:24px;margin-bottom:6px;">⏳</div>
                <div style="font-size:12.5px;">Оновлення даних розкладу...</div>
            </div>
        </div>

        <!-- Футер з лічильником та швидкими переходами (компактний) -->
        <div style="padding:8px 14px;background:var(--color-bg-secondary);border-top:1px solid var(--color-border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;flex-shrink:0;">
            <div style="font-size:11.5px;color:var(--color-text-secondary);display:flex;align-items:center;gap:5px;">
                <span>🎓 Проведено:</span>
                <strong id="modal-conducted-count" style="color:var(--color-primary);font-size:12px;">—</strong>
                <button type="button" onclick="openConductedLessonsModal()" class="btn btn-secondary btn-sm" style="font-size:10px;padding:1px 5px;" title="Змінити вручну">✏️</button>
            </div>

            <div style="display:flex;gap:6px;">
                <a href="{% url 'teacher_students' %}?tab=schedule" class="btn btn-secondary btn-sm" style="font-weight:700;font-size:11.5px;padding:4px 8px;">
                    🗓️ Повний
                </a>
                <button type="button" class="btn btn-primary btn-sm" onclick="closeTodayScheduleModal()" style="font-weight:700;font-size:11.5px;padding:4px 10px;">
                    Зрозуміло
                </button>
            </div>
        </div>

    </div>
</div>

<script>
function openTodayScheduleModal() {
    var modal = document.getElementById('today-schedule-modal');
    if (!modal) return;
    modal.style.display = 'flex';
    loadTodayScheduleData();
}

function closeTodayScheduleModal() {
    var modal = document.getElementById('today-schedule-modal');
    if (modal) modal.style.display = 'none';
}

function loadTodayScheduleData() {
    var body = document.getElementById('today-schedule-modal-body');
    var subtitle = document.getElementById('today-schedule-date-subtitle');
    var conductedEl = document.getElementById('modal-conducted-count');

    fetch('/api/today-schedule/')
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (!data.success) {
                body.innerHTML = '<div style="color:#ef4444;text-align:center;padding:16px;font-size:12.5px;">Не вдалося завантажити розклад.</div>';
                return;
            }

            subtitle.textContent = data.weekday_display + ', ' + data.date_display;

            if (data.conducted_info && conductedEl) {
                var manualBadge = data.conducted_info.is_manual ? ' (вручну)' : '';
                conductedEl.textContent = data.conducted_info.count + manualBadge;
            }

            var lessons = data.lessons || [];
            if (lessons.length === 0) {
                body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--color-text-muted);"><div style="font-size:26px;margin-bottom:4px;">🔔</div><div style="font-size:12.5px;">Розклад дзвінків ще не створено у системі.</div></div>';
                return;
            }

            var html = '<div style="display:flex;flex-direction:column;gap:4px;">';

            for (var i = 0; i < lessons.length; i++) {
                var l = lessons[i];
                var cardBorder = 'var(--color-border)';
                var cardBg = 'var(--color-surface)';
                var statusBadge = '';

                if (l.is_current) {
                    cardBorder = '#10b981';
                    cardBg = 'rgba(16, 185, 129, 0.07)';
                    statusBadge = '<span style="background:#10b981;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;display:inline-flex;align-items:center;gap:3px;box-shadow:0 1px 4px rgba(16,185,129,0.3);"><span style="width:5px;height:5px;border-radius:50%;background:#fff;animation:livePulse 1s infinite alternate;"></span> ЗАРАЗ (' + l.rem_minutes + ' хв)</span>';
                } else if (l.is_past) {
                    cardBg = 'var(--color-bg-secondary)';
                    statusBadge = '<span style="font-size:10.5px;font-weight:700;color:var(--color-text-muted);">✓ Завершено</span>';
                } else if (l.is_future) {
                    statusBadge = '<span style="font-size:10.5px;font-weight:600;color:var(--color-text-muted);">Попереду</span>';
                }

                html += '<div style="border:1px solid ' + cardBorder + ';background:' + cardBg + ';border-radius:var(--radius-sm);padding:6px 10px;transition:all 0.15s ease;' + (l.is_current ? 'box-shadow:0 0 0 2px rgba(16,185,129,0.22);' : '') + '">';
                
                // Основний рядок уроку
                html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">';
                
                // Ліва частина: номер уроку, час, клас та предмет
                html += '<div style="display:flex;align-items:center;gap:8px;min-width:0;">';
                html += '<div style="width:24px;height:24px;border-radius:6px;background:' + (l.is_current ? '#10b981;color:#fff;' : 'rgba(99,102,241,0.1);color:var(--color-primary);') + 'display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex-shrink:0;">' + l.lesson_number + '</div>';
                
                html += '<div style="min-width:0;">';
                html += '<div style="font-weight:800;font-size:12.5px;color:var(--color-text-primary);line-height:1.2;">' + l.lesson_number + '-й урок <span style="font-weight:600;font-size:11px;color:var(--color-text-muted);">(' + l.start_time + '–' + l.end_time + ')</span></div>';

                if (l.has_class) {
                    html += '<div style="display:flex;align-items:center;gap:5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">';
                    html += '<span class="class-tag" style="font-size:10.5px;font-weight:800;padding:1px 5px;">' + l.class_name + '</span>';
                    if (l.subject_name) {
                        html += '<span style="font-size:11px;color:' + l.subject_color + ';font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + l.subject_icon + ' ' + l.subject_name + '</span>';
                    }
                    html += '</div>';
                } else {
                    html += '<div style="font-size:11px;color:var(--color-text-muted);">вікно (немає уроку)</div>';
                }
                html += '</div>'; // end text
                html += '</div>'; // end left

                // Права частина: статус
                html += '<div style="text-align:right;flex-shrink:0;">' + statusBadge + '</div>';
                html += '</div>'; // end main row

                // ── ВІЗУАЛЬНИЙ ПРОГРЕС-БАР ПОТОЧНОГО УРОКУ ──
                if (l.is_current) {
                    var pct = Math.min(100, Math.max(0, l.progress_percent || 0));
                    html += '<div style="margin-top:5px;padding-top:4px;border-top:1px dashed rgba(16,185,129,0.25);">';
                    html += '<div style="height:5px;width:100%;background:rgba(16,185,129,0.18);border-radius:3px;overflow:hidden;">';
                    html += '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#10b981,#059669);border-radius:3px;transition:width 0.3s ease;"></div>';
                    html += '</div>';
                    html += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#059669;font-weight:700;margin-top:2px;">';
                    html += '<span>⏱️ Минуло: ' + (l.elapsed_minutes || 0) + ' хв</span>';
                    html += '<span>Залишилось: ' + l.rem_minutes + ' хв (' + pct + '%)</span>';
                    html += '</div>';
                    html += '</div>';
                }

                html += '</div>'; // end lesson card

                // ── ПЕРЕРВА ──
                if (l.is_break_now) {
                    var bPct = Math.min(100, Math.max(0, l.break_progress_percent || 0));
                    html += '<div style="background:rgba(245,158,11,0.1);border:1px dashed #f59e0b;border-radius:var(--radius-sm);padding:5px 9px;margin:2px 0;">';
                    html += '<div style="display:flex;align-items:center;justify-content:space-between;color:#d97706;font-size:11px;font-weight:700;">';
                    html += '<span style="display:inline-flex;align-items:center;gap:4px;"><span>☕</span> <span>ЗАРАЗ ПЕРЕРВА (' + l.break_after + ' хв)</span></span>';
                    html += '<span>до уроку: ' + l.break_rem_minutes + ' хв</span>';
                    html += '</div>';
                    
                    // Візуальний прогрес-бар перерви
                    html += '<div style="height:4px;width:100%;background:rgba(245,158,11,0.2);border-radius:2px;overflow:hidden;margin-top:3px;">';
                    html += '<div style="height:100%;width:' + bPct + '%;background:linear-gradient(90deg,#f59e0b,#d97706);border-radius:2px;transition:width 0.3s ease;"></div>';
                    html += '</div>';
                    html += '<div style="display:flex;justify-content:space-between;font-size:9.5px;color:#b45309;font-weight:600;margin-top:1px;">';
                    html += '<span>Минуло: ' + (l.break_elapsed_minutes || 0) + ' з ' + l.break_after + ' хв</span>';
                    html += '<span>' + bPct + '%</span>';
                    html += '</div>';
                    html += '</div>';
                } else if (l.break_after && l.break_after > 0 && i + 1 < lessons.length) {
                    html += '<div style="text-align:center;font-size:10px;color:var(--color-text-muted);padding:1px 0;line-height:1.2;">';
                    html += '☕ Перерва ' + l.break_after + ' хв';
                    html += '</div>';
                }
            }

            html += '</div>';
            body.innerHTML = html;
        })
        .catch(function(err) {
            console.error('Error fetching today schedule:', err);
            body.innerHTML = '<div style="color:#ef4444;text-align:center;padding:16px;font-size:12.5px;">Помилка завантаження даних.</div>';
        });
}

document.addEventListener('click', function(e) {
    var modal = document.getElementById('today-schedule-modal');
    if (modal && e.target === modal) closeTodayScheduleModal();
});
</script>
