{% load static %}
<aside class="sidebar settings-tools-sidebar" id="settings-main-sidebar" aria-label="Меню налаштувань">



    <div class="sidebar-card">
        <div class="sidebar-header">Налаштування</div>
        <ul class="sidebar-list" role="list" id="settings-sidebar-links">
            <li class="sidebar-tab-item {% if active_tab == 'profile' %}active{% endif %}">
                <a href="{% url 'teacher_settings' %}?tab=profile" onclick="if(typeof switchSettingsTabFromSidebar==='function'){return switchSettingsTabFromSidebar('profile', this);}">
                    <span>👤</span><span>Профіль вчителя</span>
                </a>
            </li>
            <li class="sidebar-tab-item {% if active_tab == 'environment' %}active{% endif %}">
                <a href="{% url 'teacher_settings' %}?tab=environment" onclick="if(typeof switchSettingsTabFromSidebar==='function'){return switchSettingsTabFromSidebar('environment', this);}">
                    <span>🏫</span><span>Середовище та заклад</span>
                </a>
            </li>
            <li class="sidebar-tab-item {% if active_tab == 'ai' %}active{% endif %}">
                <a href="{% url 'teacher_settings' %}?tab=ai" onclick="if(typeof switchSettingsTabFromSidebar==='function'){return switchSettingsTabFromSidebar('ai', this);}">
                    <span>🤖</span><span>Модуль ШІ</span>
                </a>
            </li>
        </ul>
    </div>

    {% include 'feed/components/teacher_page_tools.html' with tools_area='settings' %}

</aside>
