<template id="changelog-template" data-src="{% url 'ui_dialog' 'changelog' %}"></template>
<script>
async function openChangelogModal() {
    if (!await window.mountDeferredDialog("changelog-template")) return;
    const m = document.getElementById('changelog-modal');
    if (m) {
        m.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
}

function closeChangelogModal() {
    const m = document.getElementById('changelog-modal');
    if (m) {
        m.style.display = 'none';
        document.body.style.overflow = '';
    }
}

{% if user.is_authenticated and user.teacher_profile %}
function switchChangelogTab(tab) {
    const paneTeacher = document.getElementById('changelog-pane-teacher');
    const paneStudent = document.getElementById('changelog-pane-student');
    const btnTeacher = document.getElementById('tab-btn-teacher');
    const btnStudent = document.getElementById('tab-btn-student');

    if (!paneTeacher || !paneStudent) return;

    if (tab === 'student') {
        paneTeacher.style.display = 'none';
        paneStudent.style.display = 'flex';
        if (btnStudent) { btnStudent.classList.add('btn-primary'); btnStudent.classList.remove('btn-secondary'); }
        if (btnTeacher) { btnTeacher.classList.add('btn-secondary'); btnTeacher.classList.remove('btn-primary'); }
    } else {
        paneTeacher.style.display = 'flex';
        paneStudent.style.display = 'none';
        if (btnTeacher) { btnTeacher.classList.add('btn-primary'); btnTeacher.classList.remove('btn-secondary'); }
        if (btnStudent) { btnStudent.classList.add('btn-secondary'); btnStudent.classList.remove('btn-primary'); }
    }
}
{% endif %}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeChangelogModal();
    }
});

document.addEventListener('click', function(e) {
    const m = document.getElementById('changelog-modal');
    if (m && e.target === m) {
        closeChangelogModal();
    }
});
</script>
