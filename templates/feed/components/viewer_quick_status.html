<div class="fv-quick-status" aria-label="Коротко про роботу">
    <button type="button" class="fv-status-chip {% if submission.ai_generated_detected %}fv-status-warning{% endif %}" id="fv-quick-ai" onclick="selectReviewPanel('ai', true)" title="{% if submission.ai_generated_detected %}Виявлено ознаки використання ШІ{% if submission.ai_generated_percent is not None %}: {{ submission.ai_generated_percent }}%{% endif %} ({{ submission.get_ai_generated_confidence_display }}). {{ submission.ai_generated_details }}{% elif submission.ai_status == 'success' or submission.student_ai_checked %}Виразних ознак ШІ не знайдено; самостійність не підтверджено{% else %}Ознаки використання ШІ ще не перевірено{% endif %}. ШІ {% if submission.is_ai_allowed %}дозволено{% else %}не дозволено{% endif %} вчителем.">
        {% if submission.ai_generated_detected %}🤖 Ознаки ШІ{% elif submission.ai_status == 'success' or submission.student_ai_checked %}🤖 Авторство: невідоме{% else %}🤖 ШІ: не перевірено{% endif %}
    </button>
    <button type="button" class="fv-status-chip {% if dup_info.is_duplicate %}fv-status-warning{% endif %}" id="fv-quick-duplicate" onclick="selectReviewPanel('info', true)" title="{% if dup_info.is_duplicate %}{{ dup_info.warning_message }}{% elif submission.ignore_plagiarism or dup_info.plagiarism_ignored %}Вчитель дозволив спільну роботу; збіг файлів не враховується як плагіат{% elif not submission.file %}Для перевірки повного збігу потрібен прикріплений файл{% else %}Повного збігу з іншими роботами або матеріалами вчителя не виявлено{% endif %}">
        {% if dup_info.is_duplicate %}{% if dup_info.type == 'teacher_duplicate' %}⚠ Копія матеріалу{% else %}⚠ Збіг роботи{% endif %}{% elif submission.ignore_plagiarism or dup_info.plagiarism_ignored %}🔎 Збіг дозволено{% elif not submission.file %}🔎 Збіг: не перевірено{% else %}🔎 Збігів не виявлено{% endif %}
    </button>
    <button type="button" class="fv-status-chip" id="fv-quick-group" onclick="selectReviewPanel('info', true)" title="{% if group_members %}Учасники: {{ submission.get_group_members_display|join:', ' }}{% elif submission.ignore_plagiarism or dup_info.plagiarism_ignored %}Позначено як спільну роботу{% else %}Здано як індивідуальну роботу{% endif %}">
        {% if group_members %}👥 Групова ({{ group_members|length }}){% elif submission.ignore_plagiarism or dup_info.plagiarism_ignored %}👥 Спільна{% else %}👤 Індивідуальна{% endif %}
    </button>
    {% if submission.is_resubmission or submission.resubmission_attempt > 1 %}<button type="button" class="fv-status-chip" onclick="selectReviewPanel('info', true)">↻ Спроба {{ submission.resubmission_attempt }}</button>{% endif %}
    {% if not submission.is_latest_attempt %}<button type="button" class="fv-status-chip fv-status-warning" onclick="selectReviewPanel('info', true)">⚠ Попередня версія</button>{% endif %}
</div>
