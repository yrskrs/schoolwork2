<div class="submission-side-card submission-ai-card" style="padding: 16px 18px; border-radius: var(--radius-lg);">
{% if assignment.allow_ai_usage %}
    <div class="submission-ai-status">
        <div style="font-size: 14px; font-weight: 700; color: var(--color-success); margin-bottom: 4px;">
            <strong style="color:inherit;">Використання ШІ дозволено:</strong>
        </div>
        <div style="font-size: 13px; color: var(--color-text-secondary); line-height: 1.5;">
            вчитель дозволив допомогу ШІ для цього завдання.
        </div>
    </div>
{% else %}
    <div class="submission-ai-status">
        <div style="font-size: 14px; font-weight: 700; color: var(--color-warning, #f59e0b); margin-bottom: 4px;">
            <strong style="color:inherit;">Самостійна робота:</strong>
        </div>
        <div style="font-size: 13px; color: var(--color-text-secondary); line-height: 1.5;">
            вчитель не дозволив використання ШІ для виконання цього завдання.
        </div>
    </div>
{% endif %}
</div>
