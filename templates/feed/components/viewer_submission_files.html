{% if total_items_count > 1 %}
<div class="fv-student-files-toolbar">
    <label for="fv-file-picker" class="fv-sr-only">Файли та посилання роботи ({{ total_items_count }})</label>
    <select id="fv-file-picker" class="form-input" onchange="window.location.assign(this.value)">
        {% for sf in submission_files %}<option value="?{% if nav_query_string %}{{ nav_query_string }}&{% endif %}file_id={{ sf.id }}" {% if sf.id == active_file_id %}selected{% endif %}>{{ forloop.counter }} / {{ total_items_count }} · {{ sf.get_file_icon }} {{ sf.original_name|default:sf.file.name }}</option>{% endfor %}
        {% if submission.link %}
        <option value="?{% if nav_query_string %}{{ nav_query_string }}&{% endif %}file_id=link" {% if active_file_id == 'link' %}selected{% endif %}>{{ total_items_count }} / {{ total_items_count }} · 🔗 Веб-посилання: {{ submission.link|truncatechars:42 }}</option>
        {% endif %}
    </select>
    {% if prev_file_id %}<a href="?{% if nav_query_string %}{{ nav_query_string }}&{% endif %}file_id={{ prev_file_id }}" class="btn btn-secondary btn-sm" id="prev-file-nav-btn" title="Попередній пункт ([)">‹</a>{% endif %}
    {% if next_file_id %}<a href="?{% if nav_query_string %}{{ nav_query_string }}&{% endif %}file_id={{ next_file_id }}" class="btn btn-secondary btn-sm" id="next-file-nav-btn" title="Наступний пункт (])">›</a>{% endif %}
    {% if submission_files|length > 1 %}
    <a href="{% url 'download_submission_files_zip' submission.id %}" class="btn btn-secondary btn-sm" title="Завантажити всі файли роботи">📦 ZIP</a>
    {% endif %}
</div>
{% endif %}
