<section class="assignment-detail-help-card" id="assignment-help-card" aria-label="Допомога із завданням">
    <div class="assignment-detail-help-actions">
        <button type="button" onclick="openCriteriaModal()" class="btn btn-secondary btn-block">Критерії оцінювання</button>
        {% if assignment.allow_student_ai_understanding %}
        <button type="button" onclick="openAiUnderstandingModal({{ assignment.pk }})" class="btn btn-secondary btn-block btn-ai-explain">Пояснення завдання від ШІ</button>
        {% endif %}
    </div>
    <details class="assignment-detail-guide">
        <summary>Як працювати із завданням</summary>
        {% include 'feed/components/assignment_detail/navigation.html' %}
    </details>
</section>
