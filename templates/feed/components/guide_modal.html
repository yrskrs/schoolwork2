<template id="guide-template">
<!-- ── Інтерактивна інструкція користувача (Довідка по розділах сайту) ── -->
<div id="guide-modal" 
     class="guide-modal-backdrop"
     style="display:none;position:fixed;inset:0;width:100%;height:100%;background:rgba(15,23,42,0.65);z-index:99999;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px);box-sizing:border-box;"
     role="dialog"
     aria-labelledby="guide-modal-title"
     aria-modal="true">

    <div class="custom-modal-content guide-modal-dialog" 
         style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);width:100%;max-width:780px;box-shadow:0 25px 60px rgba(0,0,0,0.3);overflow:hidden;height:85vh;max-height:90vh;display:flex;flex-direction:column;animation:rescheduleModalIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);">

        <!-- 1. Шапка модального вікна -->
        <div style="padding:14px 20px;background:var(--color-bg-secondary);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;">
            <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:24px;line-height:1;">📖</span>
                <div>
                    <h2 id="guide-modal-title" style="margin:0;font-size:16px;font-weight:800;color:var(--color-text-primary);display:flex;align-items:center;gap:8px;">
                        <span>Як користуватися сайтом</span>
                        <span style="background:rgba(99,102,241,0.12);color:var(--color-primary);font-size:11px;padding:2px 8px;border-radius:12px;font-weight:800;letter-spacing:0.02em;">
                            Довідка
                        </span>
                    </h2>
                    <div style="font-size:11.5px;color:var(--color-text-muted);margin-top:2px;">
                        {% if user.is_authenticated and user.teacher_profile %}
                        Посібник для викладачів та учнів платформи
                        {% else %}
                        Інструкція для учнів: як виконувати та здавати завдання
                        {% endif %}
                    </div>
                </div>
            </div>
            <button type="button" 
                    onclick="closeGuideModal()" 
                    style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--color-text-muted);padding:4px 8px;line-height:1;border-radius:6px;transition:all 0.15s ease;" 
                    aria-label="Закрити вікно інструкції"
                    class="guide-close-btn">
                ✕
            </button>
        </div>

        {% if user.is_authenticated and user.teacher_profile %}
        <!-- 2. Вкладки для вчителя (Розділення: Для вчителів / Для учнів) -->
        <div style="display:flex;background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:6px 18px;gap:8px;flex-shrink:0;">
            <button type="button" 
                    id="guide-tab-btn-teacher" 
                    onclick="switchGuideTab('teacher')" 
                    class="btn btn-sm btn-primary" 
                    style="font-size:12px;font-weight:700;padding:5px 14px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:6px;">
                <span>👨‍🏫</span> <span>Для вчителів</span>
            </button>
            <button type="button" 
                    id="guide-tab-btn-student" 
                    onclick="switchGuideTab('student')" 
                    class="btn btn-sm btn-secondary" 
                    style="font-size:12px;font-weight:700;padding:5px 14px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:6px;">
                <span>🎓</span> <span>Для учнів (як бачать учні)</span>
            </button>
        </div>
        {% else %}
        <!-- Інформаційний банер для учнів -->
        <div style="background:rgba(99,102,241,0.06);border-bottom:1px solid var(--color-border);padding:8px 18px;font-size:12px;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px;flex-shrink:0;">
            <span>🎓</span> <span>Інструкція для учнів: підказки щодо завдань, файлів, коментарів та перевірки робіт.</span>
        </div>
        {% endif %}

        <!-- 3. Панель швидкого пошуку та поточного статусу -->
        <div style="padding:10px 18px;background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;flex-direction:column;gap:8px;flex-shrink:0;">
            <div style="display:flex;align-items:center;gap:8px;width:100%;flex-wrap:wrap;">
                <div style="position:relative;display:flex;align-items:center;flex:1;min-width:220px;">
                    <span style="position:absolute;left:12px;color:var(--color-text-muted);font-size:14px;pointer-events:none;">🔍</span>
                    <input type="search" 
                           id="guide-search-input" 
                           oninput="filterGuideTopics(this.value)" 
                           placeholder="Швидкий пошук у довідці..." 
                           style="width:100%;padding:8px 12px 8px 34px;font-size:12.5px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg-secondary);color:var(--color-text-primary);box-sizing:border-box;outline:none;transition:border-color 0.15s ease;"
                           aria-label="Пошук по інструкції">
                </div>
                <div style="display:flex;gap:4px;flex-shrink:0;">
                    <button type="button" 
                            onclick="expandAllGuideCategories()" 
                            class="btn btn-secondary btn-sm" 
                            style="font-size:11px;padding:5px 9px;font-weight:700;display:inline-flex;align-items:center;gap:3px;" 
                            title="Розгорнути всі розділи інструкції">
                        <span>▾</span> <span>Розгорнути всі</span>
                    </button>
                    <button type="button" 
                            onclick="collapseAllGuideCategories()" 
                            class="btn btn-secondary btn-sm" 
                            style="font-size:11px;padding:5px 9px;font-weight:700;display:inline-flex;align-items:center;gap:3px;" 
                            title="Згорнути всі розділи інструкції">
                        <span>▴</span> <span>Згорнути всі</span>
                    </button>
                </div>
            </div>

            <!-- Індикатор авторозпізнавання поточної сторінки -->
            <div id="guide-current-context-banner" style="display:none;font-size:12px;color:var(--color-primary);background:rgba(99,102,241,0.08);padding:6px 12px;border-radius:var(--radius-sm);border:1px solid rgba(99,102,241,0.2);align-items:center;justify-content:space-between;gap:8px;">
                <div style="display:flex;align-items:center;gap:6px;">
                    <span class="guide-pulsing-dot"></span>
                    <span>Розділ для вашої поточної сторінки відкрито автоматично нижче:</span>
                </div>
                <strong id="guide-current-page-label" style="font-size:11.5px;color:var(--color-text-primary);"></strong>
            </div>
        </div>

        <!-- 4. Тіло списку категорій інструкції (Акордеон) -->
        <div id="guide-accordion-container" style="flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;">

            {% if user.is_authenticated and user.teacher_profile %}
            <!-- ═══════════════════════════════════════════════════════
                 РОЗДІЛ ДЛЯ ВЧИТЕЛІВ (НЕ ВІДОБРАЖАЄТЬСЯ УЧНЯМ)
                 ═══════════════════════════════════════════════════════ -->
            <div id="guide-pane-teacher" style="display:flex;flex-direction:column;gap:12px;">

                <!-- Вчитель 1: СТВОРЕННЯ ЗАВДАНЬ ТА КРИТЕРІЇ ШІ -->
                <div class="guide-card" id="guide-category-teacher-dashboard" data-category="teacher_dashboard" data-keywords="вчитель створення завдання критерії оцінювання ші генерація дедлайн дублювання класи усна робота без здачі файл умова">
                    <button type="button" class="guide-card-header" onclick="toggleGuideCategory('teacher_dashboard')" aria-expanded="false">
                        <div class="guide-header-title">
                            <span class="guide-cat-icon">📋</span>
                            <div class="guide-header-text">
                                <strong>Кабінет вчителя та створення завдань</strong>
                                <span class="guide-cat-sub">Публікація уроків, ШІ-генерація критеріїв, дублювання, дедлайни та усні завдання</span>
                            </div>
                        </div>
                        <div class="guide-header-meta">
                            <span class="guide-active-page-badge" id="badge-guide-teacher-dashboard" style="display:none;">📍 Ви зараз на цій сторінці</span>
                            <span class="guide-chevron">▾</span>
                        </div>
                    </button>
                    <div class="guide-card-body" id="body-guide-teacher-dashboard" style="display:none;">
                        <div class="guide-content-inner">
<p>Основні розділи кабінету завжди розташовано зверху правої панелі в блоці «Робота». На телефоні їх відкриває меню «Розділи кабінету вчителя».</p>
<div class="guide-step"><span class="guide-step-num">1</span><div><strong>Створіть завдання.</strong><p>Натисніть «➕ Завдання» у верхній панелі. Зліва заповніть тему, вказівки й матеріали. Справа, у «🏫 Кому призначено», оберіть предмет і класи; єдиний предмет підставляється автоматично. Тут же можна ввімкнути індивідуальне завдання.</p></div></div>
<div class="guide-step"><span class="guide-step-num">2</span><div><strong>Додайте матеріали та критерії.</strong><p>Файли можна додавати з різних папок. За потреби позначте файл з умовою для ШІ, розгорніть власні критерії та параметри ШІ. Усі ці поля зберігаються разом із завданням. У параметрах ШІ можна обрати спільний шаблон, а в «Окремі критерії для класів» — інший шаблон та ГР для конкретного класу. Власна розбаловка роботи має пріоритет.</p></div></div>
<div class="guide-step"><span class="guide-step-num">3</span><div><strong>Оберіть публікацію.</strong><p>У правому блоці «Публікація та терміни» задайте дедлайн, публікацію зараз, чернетку чи відкладений час. Для усної роботи можна ввімкнути «Без здачі». Кнопка збереження доступна під час прокручування.</p></div></div>
<div class="guide-step"><span class="guide-step-num">4</span><div><strong>Знайдіть потрібне завдання.</strong><p>Вкладки «Опубліковані», «Чернетки», «Заплановані» й «Архів» показують кількість завдань. Клас, предмет, дата та пошук розташовані біля списку.</p></div></div>
<div class="guide-step"><span class="guide-step-num">5</span><div><strong>Додаткові дії.</strong><p>Імпорт і експорт ZIP та календар перенесень розміщено праворуч під меню «Робота». На телефоні блок «Додаткові дії» потрібно розгорнути.</p></div></div>
</div>
                    </div>
                </div>

                <!-- Вчитель 2: ЦЕНТР НАЛАШТУВАНЬ ТА ЗАКЛАД -->
                <div class="guide-card" id="guide-category-teacher-settings" data-category="teacher_settings" data-keywords="налаштування профіль заклад освіта школа семестри чверті розклад дзвінків дзвінки зміни пароль аватар супер-адміністратор гр нуш">
                    <button type="button" class="guide-card-header" onclick="toggleGuideCategory('teacher_settings')" aria-expanded="false">
                        <div class="guide-header-title">
                            <span class="guide-cat-icon">⚙️</span>
                            <div class="guide-header-text">
                                <strong>Центр налаштувань: Профіль, Заклад та Розклад</strong>
                                <span class="guide-cat-sub">Особисті дані, назва школи, структура року, розклад дзвінків 1/2 змін та групи результатів</span>
                            </div>
                        </div>
                        <div class="guide-header-meta">
                            <span class="guide-active-page-badge" id="badge-guide-teacher-settings" style="display:none;">📍 Ви зараз на цій сторінці</span>
                            <span class="guide-chevron">▾</span>
                        </div>
                    </button>
                    <div class="guide-card-body" id="body-guide-teacher-settings" style="display:none;">
                        <div class="guide-content-inner">
<p>Налаштування розділено на «Профіль», «Середовище та заклад» і «Модуль ШІ». На телефоні користуйтеся компактними вкладками.</p>
<div class="guide-step"><span class="guide-step-num">1</span><div><strong>Профіль.</strong><p>Тут змінюються особисті дані, аватар, пароль, предмети й класи вчителя.</p></div></div>
<div class="guide-step"><span class="guide-step-num">2</span><div><strong>Середовище та заклад.</strong><p>Тут доступні шкільні дані, користувачі, час дзвінків і навчальні періоди. Системні зміни адміністратора доступні у відповідному режимі.</p></div></div>
<div class="guide-step"><span class="guide-step-num">3</span><div><strong>Додаткові дії.</strong><p>Довідка, журнал дій, завантаження резервної копії та перемикач режиму адміністратора зібрані в правому блоці. На телефоні цей блок згорнутий.</p></div></div>
<div class="guide-step"><span class="guide-step-num">4</span><div><strong>Збереження.</strong><p>Збережіть зміни кнопкою відповідної форми. Переходи до робочих розділів доступні у верхній навігації та мобільному меню кабінету.</p></div></div>
</div>
                    </div>
                </div>

                <!-- Вчитель 3: НАЛАШТУВАННЯ ШІ ТА ПАКЕТНА ПЕРЕВІРКА -->
                <div class="guide-card" id="guide-category-teacher-ai-settings" data-category="teacher_ai_settings" data-keywords="ші налаштування gemini api ключ openai deepseek groq тестування тест з'єднання модель температура пакетна перевірка черга failover">
                    <button type="button" class="guide-card-header" onclick="toggleGuideCategory('teacher_ai_settings')" aria-expanded="false">
                        <div class="guide-header-title">
                            <span class="guide-cat-icon">🤖</span>
                            <div class="guide-header-text">
                                <strong>Модуль ШІ: Налаштування API, моделі та пакетна перевірка</strong>
                                <span class="guide-cat-sub">Ключі Google Gemini, перевірка з'єднання, резервний Failover та пакетна автоперевірка</span>
                            </div>
                        </div>
                        <div class="guide-header-meta">
                            <span class="guide-active-page-badge" id="badge-guide-teacher-ai-settings" style="display:none;">📍 Ви зараз на цій сторінці</span>
                            <span class="guide-chevron">▾</span>
                        </div>
                    </button>
                    <div class="guide-card-body" id="body-guide-teacher-ai-settings" style="display:none;">
                        <div class="guide-content-inner">
<p>Модуль ШІ має п’ять вкладок: «Підключення», «Критерії», «Моделі», «Статистика» й «Помилки».</p>
<div class="guide-step"><span class="guide-step-num">1</span><div><strong>Підключення.</strong><p>Оберіть провайдера, вкажіть основний ключ і модель. За потреби налаштуйте резервне підключення й розгорніть додаткові параметри. «Тест» показує перебіг і результат біля натиснутої кнопки, також у статистиці та черзі моделей. Він не змінює основну модель.</p></div></div>
<div class="guide-step"><span class="guide-step-num">2</span><div><strong>Критерії та моделі.</strong><p>У «Критеріях» керуйте шаблонами оцінювання. У «Моделях» виберіть провайдера й точний ідентифікатор, додайте модель та налаштуйте порядок fallback. Каталог підказує моделі й квоти. Для провайдера потрібен його ключ або Base URL у «Підключення»; без них модель пропускається.</p></div></div>
<div class="guide-step"><span class="guide-step-num">3</span><div><strong>Графік використання.</strong><p>У «Статистиці → Графік» оберіть період від 24 годин до всього часу й вигляд: стовпчики, лінії або криві. Кольори й легенда позначають окремі моделі. На графіку можна перемикати запити або токени, фільтрувати модель, провайдера, тип запиту й успіх чи помилку. Натисніть стовпчик або точку для точного значення; з клавіатури використовуйте Tab і стрілки.</p></div></div>
<div class="guide-step"><span class="guide-step-num">4</span><div><strong>Показники моделей.</strong><p>У «Статистиці → Моделі» використайте пошук і сторінки. Розгорніть показники потрібної моделі: RPM за останню хвилину та пік, RPD за сьогодні й середнє, кількість запитів, успішність, токени й останній запит. Картки враховують обраний період; фільтри графіка діють окремо. Час — за часовим поясом школи.</p></div></div>
<div class="guide-step"><span class="guide-step-num">5</span><div><strong>Помилки й пакетна перевірка.</strong><p>Причини невдалих запитів доступні у «Помилках». Для групової перевірки відкрийте «ШІ-перевірка» у меню «Робота»: основні фільтри й запуск біля черги, пауза між запитами та оновлення списку — у «Додаткових діях».</p></div></div>
<div class="guide-tip-box info">Перегляд і фільтрація графіка використовують журнал запитів та не запускають нових перевірок ШІ.</div>
</div>
                    </div>
                </div>

                <!-- Вчитель 4: ПЕРЕВІРКА РОБІТ ТА FILE VIEWER -->
                <div class="guide-card" id="guide-category-teacher-fileviewer" data-category="teacher_fileviewer" data-keywords="перевірка робіт file viewer оцінювання бали гр нуш коментарі відгук зауваження zip детекція ші плагіат доопрацювання">
                    <button type="button" class="guide-card-header" onclick="toggleGuideCategory('teacher_fileviewer')" aria-expanded="false">
                        <div class="guide-header-title">
                            <span class="guide-cat-icon">👁️</span>
                            <div class="guide-header-text">
                                <strong>Перевірка робіт в інтерактивному File Viewer</strong>
                                <span class="guide-cat-sub">Перегляд файлів учнів у браузері, виставлення балів за ГР НУШ, детекція ШІ та відгуки</span>
                            </div>
                        </div>
                        <div class="guide-header-meta">
                            <span class="guide-active-page-badge" id="badge-guide-teacher-fileviewer" style="display:none;">📍 Ви зараз на цій сторінці</span>
                            <span class="guide-chevron">▾</span>
                        </div>
                    </button>
                    <div class="guide-card-body" id="body-guide-teacher-fileviewer" style="display:none;">
                        <div class="guide-content-inner">
                                    <p>Прапорці ГР у «Групи результатів і глибоке мислення» визначають наступний запит. Переглядач відновлює останній успішний вибір учителя; «Повернути ГР завдання» застосовує критерії цього класу. Якщо модель не перевірила обрану ГР, вона показується без бала з причиною.</p>
                                    <p>Temperature — мінливість відповіді, а не суворість оцінювання. Дозвіл ШІ задається в редакторі завдання. Позначка «Походження роботи не встановлено» не доводить самостійності; попросіть учня пояснити кроки чи показати чернетку. Детальний розбір критеріїв залишається в рекомендаціях учителю; учень бачить пояснення бала та поради.</p>

                            <div class="guide-step">
                                <span class="guide-step-num">1</span>
                                <div>
                                    <strong>Перегляд робіт без скачування на комп'ютер:</strong>
                                    <p>File Viewer підтримує відображення будь-яких навчальних форматів прямо у браузері: фотографії зошитів, документи Word (<code>.docx</code>), таблиці Excel, презентації, PDF, код із підсвіткою синтаксису. Навігація «Попередня / Наступна» й завантаження стоять у закріпленій верхній панелі. Alt + ← / → перемикає роботи. Робота учня й інструменти перевірки показуються поруч. У вкладці «Умова й матеріали» відкрито повну інструкцію та файли вчителя, у «ШІ-перевірка» — критерії й рекомендації. «Розгорнути» біля інструментів дає їм усю ширину. «Згорнути» залишає вузьку смугу вкладок і збільшує роботу учня; так само працює «Розгорнути» біля роботи. «Поруч» повертає дві області. На вузькому екрані кнопку біля роботи можна використати для повного екрана. Матеріали відкриваються по центру з вибором файла, документа або текстового вигляду; презентації мають перемикання слайдів. На телефоні вкладка «Робота учня» відкриває файл, інші вкладки — потрібний інструмент.</p>
                                </div>
                            </div>

                            <div class="guide-step">
                                <span class="guide-step-num">2</span>
                                <div>
                                    <strong>Оцінювання за групами результатів (ГР НУШ):</strong>
                                    <p>Оцінка й збереження завжди доступні у верхній панелі. Введіть бал 1–12 або відкрийте «Бали» для швидкого вибору та індивідуальних оцінок учасників. «Зберегти й далі» переходить лише після успішного збереження; Enter або Ctrl+Enter зберігає оцінку. У верхній панелі одразу видно ознаки ШІ, повний збіг файлів і групову роботу; натисніть позначку для подробиць. «Не перевірено» означає відсутність результату перевірки, а не відсутність ознак ШІ. Коментар учню пишіть у вкладці «Відгук» — кількість відгуків видно на її кнопці. Під час перемикання вкладок файл і незбережені поля залишаються на місці.</p>
                                </div>
                            </div>

                            <div class="guide-step">
                                <span class="guide-step-num">3</span>
                                <div>
                                    <strong>Повна інформація про детекцію ШІ, плагіат та спільні роботи:</strong>
                                    <p>Позначки ШІ — це припущення моделі, а не доведений факт чи точний відсоток авторства. Збіг файлів показує однаковий вміст, але сам по собі не доводить плагіат. Перевірте обставини, особливо для спільної роботи.</p><p>У «Рекомендаціях ШІ» є пояснення бала, результати за критеріями з посиланням на елементи роботи та конкретні кроки покращення. Правильний зміст в іншому форматі зараховується частково; неперевірені елементи позначаються окремо. Остаточну оцінку зберігає вчитель.</p><p>ШІ читає текст і візуальні сторінки офісних документів та PDF, формули й діаграми Excel, усі слайди презентацій. Scratch і micro:bit аналізуються без запуску; в Access доступна структура даних, але не перевіряється виконання макросів чи вигляд форм. Технічна недоступність не є помилкою учня.</p>
                                    <p>👥 <strong>Ігнорування плагіату для спільних проектів:</strong> Якщо учні виконували роботу разом у групі чи парі, але проігнорували блок зазначення співавторів, вчитель може прямо у вікні перевірки поставити прапорець <code>👥 Ігнорувати плагіат (спільна робота)</code>. Система та ШІ оцінять проект по суті без штрафу за плагіат, а статус автоматично синхронізується з роботами інших учасників.</p>
                                    <p>📝 <strong>Автоматичне зіставлення «питання-відповідь»:</strong> Якщо учень здав лише відповіді без переписування самих запитань (наприклад: <code>1. ...</code>, <code>2. ...</code>), ШІ-модуль автоматично виявляє запитання в умові або матеріалах вчителя та підставляє під них знайдені відповіді учня. ШІ заборонено заявляти «жодної відповіді не дано», якщо учень відповів на 1–2 запитання, а у коментарях учень отримує рекомендацію щодо структури «питання-відповідь».</p>
                                </div>
                            </div>

                            <div class="guide-step">
                                <span class="guide-step-num">4</span>
                                <div>
                                    <strong>Статус «Потребує доопрацювання»:</strong>
                                    <p>Якщо учень надіслав не той файл або завдання виконано неповністю, оберіть статус <em>«Потребує доопрацювання»</em> та залиште коментар. Робота повернеться учневі на доопрацювання, а після повторної здачі система автоматично оновить чергу.</p>
                                </div>
                            </div>

                                <div>

                                    <p>У лівій панелі відображається виставлений учителем бал за 12-бальною шкалою НУШ та статус перевірки.</p>
                                </div>
                            </div>

                            <div class="guide-step">
                                <span class="guide-step-num">2</span>
                                <div>
                                    <strong>Коментарі та зауваження вчителя:</strong>
                                    <p>У блоці <em>«Відгуки та зауваження вчителя»</em> відображаються персональні коментарі вчителя до вашої роботи з порадами, що саме виконано бездоганно, а де допущено неточності.</p>
                                </div>
                            </div>

                            <div class="guide-step">
                                <span class="guide-step-num">3</span>
                                <div>
                                    <strong>Повторна здача роботи (якщо вчитель повернув на доопрацювання):</strong>
                                    <p>Якщо вчитель призначив доопрацювання, на сторінці буде активне посилання на форму здачі нової спроби: ви зможете завантажити виправлений файл та вказати, що саме було виправлено.</p>
                                </div>
                            </div>

                            <div class="guide-step">
                                <span class="guide-step-num">4</span>
                                <div>
                                    <strong>Результати ШІ-самоперевірки та доброчесність:</strong>
<p>Самоперевірка показує пояснення бала й поради щодо покращення роботи; детальний розбір критеріїв залишається вчителю. Повідомлення про використання ШІ з’являється, коли виявлено конкретні ознаки.</p>

                                    <p>Якщо ви перевіряли роботу ШІ перед здачею, на сторінці відобразиться рівень виконання, орієнтовний бал та загальний статус відповідності правилам використання ШІ до цього завдання.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Повідомлення при відсутності результатів пошуку -->
            <div id="guide-no-results" style="display:none;padding:32px 16px;text-align:center;color:var(--color-text-muted);">
                <div style="font-size:32px;margin-bottom:8px;">🔍</div>
                <div style="font-size:14px;font-weight:700;color:var(--color-text-primary);">За вашим запитом нічого не знайдено</div>
                <div style="font-size:12px;margin-top:4px;">Спробуйте інші ключові слова або очистіть рядок пошуку.</div>
            </div>

        </div>

        <!-- 5. Підвал модального вікна -->
        <div style="padding:10px 20px;background:var(--color-bg-secondary);border-top:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--color-text-muted);flex-shrink:0;">
            <div style="display:flex;align-items:center;gap:6px;">
                <span>💡</span> <span>Завжди доступно у верхньому барі сайту</span>
            </div>
            <button type="button" 
                    onclick="closeGuideModal()" 
                    class="btn btn-secondary btn-sm" 
                    style="font-size:11.5px;padding:4px 14px;font-weight:700;">
                Зрозуміло
            </button>
        </div>

    </div>
</div>

</template>
<script>
/**
 * Управління інтерактивною інструкцією користувача з розділенням для вчителів та учнів
 */
(function() {
    function detectCurrentGuideContext() {
        const path = window.location.pathname || '/';

        // Сторінки вчителя
        if (path.indexOf('/teacher/view-file/') === 0) {
            return { tab: 'teacher', cat: 'teacher_fileviewer', label: 'Перевірка роботи у File Viewer' };
        }
        if (path.indexOf('/teacher/gradebook/') === 0 || path.indexOf('/gradebook/') === 0) {
            return { tab: 'teacher', cat: 'teacher_gradebook', label: 'Електронний журнал оцінок' };
        }
        if (path.indexOf('/teacher/students/') === 0) {
            return { tab: 'teacher', cat: 'teacher_classes', label: 'Керування класами та учнями' };
        }
        if (path.indexOf('/teacher/ai-settings/') === 0 || path.indexOf('/teacher/ai/batch-check/') === 0 || path.indexOf('/teacher/ai') === 0) {
            return { tab: 'teacher', cat: 'teacher_ai_settings', label: 'Модуль ШІ: Налаштування та пакетна перевірка' };
        }
        if (path.indexOf('/teacher/settings/') === 0 || path.indexOf('/teacher/profile/') === 0 || path.indexOf('/teacher/school/settings/') === 0) {
            return { tab: 'teacher', cat: 'teacher_settings', label: 'Центр налаштувань (Профіль, заклад, дзвінки)' };
        }
        if (path.indexOf('/teacher/submissions/') === 0 || /\/teacher\/assignment\/\d+\/submissions\/?/.test(path)) {
            return { tab: 'teacher', cat: 'teacher_submissions', label: 'Всі здані роботи та черга перевірки' };
        }
        if (path.indexOf('/teacher/rescheduled-calendar/') === 0 || /\/teacher\/assignment\/\d+\/reschedule\/?/.test(path)) {
            return { tab: 'teacher', cat: 'teacher_reschedule', label: 'Перенесення уроків та 30-денний календар' };
        }
        if (path.indexOf('/teacher/reports/') === 0 || path.indexOf('/teacher/reports-pdf/') === 0) {
            return { tab: 'teacher', cat: 'teacher_reports', label: 'Звіти успішності та експорт у PDF' };
        }
        if (path.indexOf('/teacher/activity/') === 0 || path.indexOf('/teacher/database/backup/') === 0) {
            return { tab: 'teacher', cat: 'teacher_activity', label: 'Журнал дій (Аудит) та резервні копії' };
        }
        if (path.indexOf('/teacher/assignment/create/') === 0 || /\/teacher\/assignment\/\d+\/edit\/?/.test(path)) {
            return { tab: 'teacher', cat: 'teacher_dashboard', label: 'Створення та редагування завдання' };
        }
        if (path.indexOf('/teacher/') === 0) {
            return { tab: 'teacher', cat: 'teacher_dashboard', label: 'Кабінет вчителя (Завдання)' };
        }

        // Сторінки учня
        if (/\/assignment\/\d+\/submit\/success\/?/.test(path)) {
            return { tab: 'student', cat: 'submit_success', label: 'Результат здачі та самоперевірка ШІ' };
        }
        if (/\/assignment\/\d+\/submit\/?/.test(path)) {
            return { tab: 'student', cat: 'submit_assignment', label: 'Здача роботи (Завантаження файлів)' };
        }
        if (/\/assignment\/\d+\/?/.test(path)) {
            return { tab: 'student', cat: 'assignment_detail', label: 'Сторінка завдання (Умови та матеріали)' };
        }
        if (path.indexOf('/my-submissions/') === 0) {
            return { tab: 'student', cat: 'my_submissions', label: 'Портал «Мої роботи»' };
        }
        if (/\/submission\/\d+\/?/.test(path)) {
            return { tab: 'student', cat: 'submission_detail', label: 'Деталі зданої роботи' };
        }
        if (path === '/' || path.indexOf('/feed/') === 0) {
            return { tab: 'student', cat: 'index', label: 'Головна стрічка (Календар та пошук)' };
        }
        return { tab: 'student', cat: 'index', label: 'Головна стрічка (Календар та пошук)' };
    }

    function getActivePane() {
        const paneTeacher = document.getElementById('guide-pane-teacher');
        if (paneTeacher && paneTeacher.style.display !== 'none') {
            return paneTeacher;
        }
        return document.getElementById('guide-pane-student');
    }

    {% if user.is_authenticated and user.teacher_profile %}
    window.switchGuideTab = function(tab) {
        const paneTeacher = document.getElementById('guide-pane-teacher');
        const paneStudent = document.getElementById('guide-pane-student');
        const btnTeacher = document.getElementById('guide-tab-btn-teacher');
        const btnStudent = document.getElementById('guide-tab-btn-student');

        if (!paneTeacher || !paneStudent) return;

        if (tab === 'student') {
            paneTeacher.style.display = 'none';
            paneStudent.style.display = 'flex';
            if (btnStudent) { btnStudent.classList.add('btn-primary'); btnStudent.classList.remove('btn-secondary'); }
            if (btnTeacher) { btnTeacher.classList.add('btn-secondary'); btnTeacher.classList.remove('btn-primary'); }
        } else {
            paneTeacher.style.display = 'flex';
            paneStudent.style.display = 'none';
            if (btnTeacher) { btnTeacher.classList.add('btn-primary'); btnTeacher.classList.remove('btn-secondary'); }
            if (btnStudent) { btnStudent.classList.add('btn-secondary'); btnStudent.classList.remove('btn-primary'); }
        }

        const searchInput = document.getElementById('guide-search-input');
        if (searchInput) {
            searchInput.value = '';
            filterGuideTopics('');
        }
    };
    {% endif %}

    let guideReturnFocus = null;
    window.openGuideModal = function(explicitCat) {
        window.mountDeferredDialog("guide-template");
        const modal = document.getElementById('guide-modal');
        if (!modal) return;

        guideReturnFocus = document.activeElement;
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        modal.querySelector('button[onclick="closeGuideModal()"]').focus({preventScroll: true});

        // Скидання пошукового рядка
        const searchInput = document.getElementById('guide-search-input');
        if (searchInput) {
            searchInput.value = '';
            filterGuideTopics('');
        }

        // Автоматичне або примусове визначення поточної сторінки/теми
        let context = detectCurrentGuideContext();
        if (explicitCat) {
            context = {
                tab: (explicitCat.indexOf('teacher_') === 0 ? 'teacher' : 'student'),
                cat: explicitCat,
                label: 'Обраний розділ інструкції'
            };
        }

        {% if user.is_authenticated and user.teacher_profile %}
        // Якщо вчитель — перемикаємо на відповідну вкладку
        if (context.tab === 'teacher') {
            switchGuideTab('teacher');
        } else {
            switchGuideTab('student');
        }
        {% endif %}

        // Очищення попередніх активних станів
        const allBadges = modal.querySelectorAll('.guide-active-page-badge');
        allBadges.forEach(b => b.style.display = 'none');

        const allCards = modal.querySelectorAll('.guide-card');
        allCards.forEach(c => c.classList.remove('guide-card-active'));

        const idSuffix = context.cat.replace(/_/g, '-');
        const targetBadge = document.getElementById('badge-guide-' + idSuffix);
        const targetCard = document.getElementById('guide-category-' + idSuffix);
        const targetBody = document.getElementById('body-guide-' + idSuffix);

        const contextBanner = document.getElementById('guide-current-context-banner');
        const contextLabel = document.getElementById('guide-current-page-label');

        if (targetBadge && targetCard && targetBody) {
            targetBadge.style.display = 'inline-flex';
            targetCard.classList.add('guide-card-active');

            // Автоматично відкриваємо акордеон для поточної сторінки
            targetBody.style.display = 'block';
            const btn = targetCard.querySelector('.guide-card-header');
            if (btn) btn.setAttribute('aria-expanded', 'true');

            if (contextBanner && contextLabel) {
                contextLabel.textContent = context.label;
                contextBanner.style.display = 'flex';
            }

            // Плавний скрол до потрібної картки
            setTimeout(() => {
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        } else {
            if (contextBanner) contextBanner.style.display = 'none';
        }
    };

    window.closeGuideModal = function() {
        const modal = document.getElementById('guide-modal');
        if (modal) {
            modal.style.display = 'none';
            document.body.style.overflow = '';
            if (guideReturnFocus && guideReturnFocus.isConnected) guideReturnFocus.focus({preventScroll: true});
        }
    };

    window.toggleGuideCategory = function(catKey) {
        const idSuffix = catKey.replace(/_/g, '-');
        const body = document.getElementById('body-guide-' + idSuffix);
        const card = document.getElementById('guide-category-' + idSuffix);
        if (!body || !card) return;

        const btn = card.querySelector('.guide-card-header');
        const isHidden = (body.style.display === 'none' || !body.style.display);

        if (isHidden) {
            body.style.display = 'block';
            if (btn) btn.setAttribute('aria-expanded', 'true');
            card.classList.add('guide-card-open');
            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 80);
        } else {
            body.style.display = 'none';
            if (btn) btn.setAttribute('aria-expanded', 'false');
            card.classList.remove('guide-card-open');
        }
    };

    window.expandAllGuideCategories = function() {
        const pane = getActivePane();
        if (!pane) return;
        const cards = pane.querySelectorAll('.guide-card');
        cards.forEach(card => {
            const body = card.querySelector('.guide-card-body');
            const btn = card.querySelector('.guide-card-header');
            if (body) body.style.display = 'block';
            if (btn) btn.setAttribute('aria-expanded', 'true');
            card.classList.add('guide-card-open');
        });
    };

    window.collapseAllGuideCategories = function() {
        const pane = getActivePane();
        if (!pane) return;
        const cards = pane.querySelectorAll('.guide-card');
        cards.forEach(card => {
            const body = card.querySelector('.guide-card-body');
            const btn = card.querySelector('.guide-card-header');
            if (body) body.style.display = 'none';
            if (btn) btn.setAttribute('aria-expanded', 'false');
            card.classList.remove('guide-card-open');
        });
    };

    window.filterGuideTopics = function(query) {
        const q = (query || '').trim().toLowerCase();
        const pane = getActivePane();
        if (!pane) return;
        const cards = pane.querySelectorAll('.guide-card');
        const noResults = document.getElementById('guide-no-results');
        let visibleCount = 0;

        cards.forEach(card => {
            const keywords = (card.getAttribute('data-keywords') || '').toLowerCase();
            const textContent = (card.textContent || '').toLowerCase();

            if (!q || keywords.indexOf(q) !== -1 || textContent.indexOf(q) !== -1) {
                card.style.display = 'flex';
                visibleCount++;
                if (q.length >= 2) {
                    const body = card.querySelector('.guide-card-body');
                    const btn = card.querySelector('.guide-card-header');
                    if (body) body.style.display = 'block';
                    if (btn) btn.setAttribute('aria-expanded', 'true');
                    card.classList.add('guide-card-open');
                }
            } else {
                card.style.display = 'none';
            }
        });

        if (noResults) {
            noResults.style.display = (visibleCount === 0) ? 'block' : 'none';
        }
    };

    // Закриття клавішею Escape
    document.addEventListener('keydown', function(e) {
        const dialog = document.getElementById('guide-modal');
        if (e.key === 'Tab' && dialog && dialog.style.display === 'flex') {
            const controls = Array.from(dialog.querySelectorAll('button, a[href], input, select, textarea, [tabindex="0"]')).filter(el => !el.disabled && el.getClientRects().length);
            const first = controls[0], last = controls[controls.length - 1];
            if (e.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))) {
                e.preventDefault(); last.focus();
            } else if (!e.shiftKey && (document.activeElement === last || !dialog.contains(document.activeElement))) {
                e.preventDefault(); first.focus();
            }
        }
        if (e.key === 'Escape') {
            const m = document.getElementById('guide-modal');
            if (m && m.style.display === 'flex') {
                closeGuideModal();
            }
        }
    });

    // Закриття при кліку на затемнений фон
    document.addEventListener('click', function(e) {
        const m = document.getElementById('guide-modal');
        if (m && e.target === m) {
            closeGuideModal();
        }
    });
})();
</script>
