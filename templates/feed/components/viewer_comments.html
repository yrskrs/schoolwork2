<!-- Коментарі / Зауваження для учня -->
                <h4 style="font-size:0.95rem;font-weight:800;margin:0 0 12px;color:var(--color-text-primary);">
                    💬 Відгук / Зауваження вчителя
                </h4>

                <div class="fv-comments-list" id="fv-comments-container">
                    {% for comment in comments %}
                    <div class="fv-comment-card" id="comment-{{ comment.id }}">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
                            <span style="font-weight:700;color:var(--color-primary);">{{ comment.get_author_name }}</span>
                            <div style="display:flex;align-items:center;gap:6px;">
                                <span style="font-size:11px;color:var(--color-text-muted);">{{ comment.created_at|date:"d.m H:i" }}</span>
                                {% if comment.author == user or user.is_superuser %}
                                <button type="button" onclick="deleteViewerComment({{ comment.id }})" style="background:none;border:none;color:var(--color-danger);cursor:pointer;padding:0;font-size:12px;" title="Видалити">✕</button>
                                {% endif %}
                            </div>
                        </div>
                        <div style="white-space:pre-wrap;line-height:1.5;">{{ comment.text }}</div>
                    </div>
                    {% empty %}
                    <p class="text-muted" style="font-size:13px;margin:0;" id="no-comments-msg">Коментарів до роботи ще немає.</p>
                    {% endfor %}
                </div>

                <!-- Швидкі шаблони відгуку -->
                <div style="margin-bottom:8px;">
                    <div style="font-size:11px;font-weight:700;color:var(--color-text-muted);text-transform:uppercase;margin-bottom:4px;">
                        ⚡ Швидкі відгуки:
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:4px;">
                        <button type="button" onclick="insertCommentSnippet('🌟 Відмінно! Завдання виконано повністю та вірно.')" class="btn btn-secondary btn-sm" style="font-size:11px;padding:3px 6px;">🌟 Відмінно!</button>
                        <button type="button" onclick="insertCommentSnippet('📝 Зверни увагу на акуратність оформлення.')" class="btn btn-secondary btn-sm" style="font-size:11px;padding:3px 6px;">📝 Оформлення</button>
                        <button type="button" onclick="insertCommentSnippet('⚠️ Перевір формули та розрахунки.')" class="btn btn-secondary btn-sm" style="font-size:11px;padding:3px 6px;">⚠️ Розрахунки</button>
                        <button type="button" onclick="insertCommentSnippet('💡 Уважно перечитай умову завдання.')" class="btn btn-secondary btn-sm" style="font-size:11px;padding:3px 6px;">💡 Умова</button>
                        <button type="button" onclick="insertCommentSnippet('🔄 Роботу повернуто на доопрацювання. Виправ зауваження та перездай.')" class="btn btn-secondary btn-sm" style="font-size:11px;padding:3px 6px;">🔄 Перездати</button>
                    </div>
                </div>

                <!-- Форма надсилання коментаря -->
                <div>
                    <textarea id="comment-textarea"
                              class="form-input"
                              rows="3"
                              placeholder="Напишіть відгук учню..."
                              style="font-size:13px;margin-bottom:8px;resize:vertical;"></textarea>
                    <button type="button" class="btn btn-primary btn-sm" style="width:100%;font-weight:700;" onclick="sendViewerComment()" id="send-comment-btn">
                        💬 Надіслати відгук
                    </button>
                </div>
