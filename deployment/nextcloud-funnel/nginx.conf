# Preserve compression for assets; HTML needs a cache-versioned Viewer URL.
map $uri $nextcloud_accept_encoding {
    default $http_accept_encoding;
    ~^/(?:index\.php(?:/|$)|$) "";
}

map $http_upgrade $nextcloud_connection {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:18080;
    server_name _;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Accept-Encoding $nextcloud_accept_encoding;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nextcloud_connection;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Nextcloud 35.0.2 Viewer.close() checks Sidebar's existence but calls a
    # method that is absent until the sidebar is initialized. Match this one
    # call only; an upstream release with a different/fixed call is untouched.
    location = /apps/viewer/js/viewer-main.mjs {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-Modified-Since "";
        proxy_set_header If-None-Match "";
        sub_filter_types application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'OCA?.Files?.Sidebar&&OCA.Files.Sidebar.setFullScreenMode(!1)' 'typeof OCA?.Files?.Sidebar?.setFullScreenMode==="function"&&OCA.Files.Sidebar.setFullScreenMode(!1)';
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store";
        add_header X-Funnel-Viewer-Fix "guarded-sidebar-close";
    }

    # The document editor emits this one absolute SDK resource URL.
    location = /sdkjs/common/device_scale.js {
        proxy_pass http://127.0.0.1:8800;
    }

    # Existing document service; virtual-path headers follow the vendor proxy example.
    # Font administration stays on the internal server-to-server connection.
    location ~* ^/office/admin(?:/|$) { return 404; }

    location /office/ {
        proxy_pass http://127.0.0.1:8800/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host/office;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nextcloud_connection;
    }

    location / {
        proxy_pass http://127.0.0.1:80;
        sub_filter_once off;
        sub_filter '/apps/viewer/js/viewer-main.mjs?' '/apps/viewer/js/viewer-main.mjs?funnel_guard=20261106&';
    }
}
